name: VEIL Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veil-automatic-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish signed VEIL APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Prepare release signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: veil-release
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::Release signing secrets are missing. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, and RELEASE_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/veil-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f "$KEYSTORE_PATH"
            echo "::error::The configured keystore/password/alias could not be validated."
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Calculate next app version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          LATEST_TAG="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -n "$LATEST_TAG" ]]; then
            BASE_VERSION="${LATEST_TAG#v}"
          else
            BASE_VERSION="$CURRENT_VERSION"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          NEXT_CODE="$((GITHUB_RUN_NUMBER + 1000))"
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1$NEXT_CODE/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"$NEXT_VERSION\"/" app/build.gradle.kts
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"
          echo "VEIL_VERSION_NAME=$NEXT_VERSION" >> "$GITHUB_ENV"
          echo "VEIL_VERSION_CODE=$NEXT_CODE" >> "$GITHUB_ENV"
          echo "Preparing VEIL v$NEXT_VERSION (versionCode $NEXT_CODE)"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: veil-release
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK" >/dev/null
          BADGING="$(aapt dump badging "$APK")"
          EXPECTED="package: name='com.veil.privacy' versionCode='$VEIL_VERSION_CODE' versionName='$VEIL_VERSION_NAME'"
          if ! grep -Fq "$EXPECTED" <<< "$BADGING"; then
            echo "::error::APK package/version metadata does not match the calculated version."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.version.outputs.version }}" \
            "app/build/outputs/apk/release/app-release.apk#VEIL.apk" \
            --title "VEIL v${{ steps.version.outputs.version }}" \
            --generate-notes
